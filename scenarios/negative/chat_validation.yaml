id: SC-NEG-002
title: 채팅방은 서로 다른 실제 사용자 2명 이상이어야 만들 수 있다
tags: [negative, chat]
steps:
  - name: alice 생성
    request: {method: POST, path: /v1/users, json: {name: alice}}
    expect: {status: 201}
    save: {alice: $.id}

  - name: 같은 사람 두 번은 400
    request: {method: POST, path: /v1/chats, json: {member_ids: ["{alice}", "{alice}"]}}
    expect: {status: 400}

  - name: 없는 사용자가 섞이면 404
    request: {method: POST, path: /v1/chats, json: {member_ids: ["{alice}", u_ghost]}}
    expect: {status: 404, json: {detail: "unknown users: u_ghost"}}

  - name: 멤버 1명은 요청 검증에서 422
    request: {method: POST, path: /v1/chats, json: {member_ids: ["{alice}"]}}
    expect: {status: 422}
